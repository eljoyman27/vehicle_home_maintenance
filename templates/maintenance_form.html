
{% extends "base.html" %}
{% block content %}

{% set editing = edit_mode|default(false) %}
{% set r = record|default({}) %}

<h1>{{ "Edit Maintenance" if editing else "Add Maintenance Record" }}</h1>

<form class="form"
      method="POST"
      action="{{ url_for('edit_maintenance', record_id=r.id) if editing else url_for('new_maintenance') }}">

  <label>
    Asset
    <select name="asset_id" required>
      {% for asset in assets %}
      <option value="{{ asset.id }}"
        {% if r.asset_id|string == asset.id|string %}selected{% endif %}>
        {{ asset.name }}
      </option>
      {% endfor %}
    </select>
  </label>

  <label>
    Task
    <input name="task"
           required
           value="{{ r.task|default('', true) }}"
           placeholder="Oil change, filter check, tire rotation...">
  </label>

  <label>
    Last Done
    <input type="date"
           name="last_done"
           id="last_done"
           value="{{ r.last_done|default('', true) }}">
  </label>

  <label>
    Due Date
    <input type="date"
           name="due_date"
           id="due_date"
           value="{{ r.due_date|default('', true) }}">
  </label>

  <label>
    Current Mileage / Hours
    <input type="number"
           name="mileage"
           min="0"
           value="{{ r.mileage|default('', true) }}">
  </label>

  <label>
    Due Mileage / Hours
    <input type="number"
           name="due_mileage"
           min="0"
           value="{{ r.due_mileage|default('', true) }}">
  </label>

  <label>
    Cost
    <input type="number"
           name="cost"
           step="0.01"
           min="0"
           value="{{ r.cost|default(0) if r.cost is defined and r.cost is not none else 0 }}">
  </label>

  <label>
    Notes
    <textarea name="notes">{{ r.notes|default('', true) }}</textarea>
  </label>

  <div class="form-actions">
    <button type="submit">
      {{ "Save Changes" if editing else "Save Maintenance" }}
    </button>

    <a href="{{ url_for('maintenance') }}"
       class="button button-secondary">
      Cancel
    </a>
  </div>
</form>

<script>
  const lastDone = document.getElementById("last_done");
  const dueDate = document.getElementById("due_date");

  function validateDates() {
    if (lastDone.value) {
      const minDate = new Date(lastDone.value + "T12:00:00");
      minDate.setDate(minDate.getDate() + 1);

      const year = minDate.getFullYear();
      const month = String(minDate.getMonth() + 1).padStart(2, "0");
      const day = String(minDate.getDate()).padStart(2, "0");

      dueDate.min = `${year}-${month}-${day}`;
    } else {
      dueDate.removeAttribute("min");
    }

    if (lastDone.value && dueDate.value &&
        dueDate.value <= lastDone.value) {
      dueDate.setCustomValidity(
        "Due Date must be later than Last Done."
      );
    } else {
      dueDate.setCustomValidity("");
    }
  }

  lastDone.addEventListener("change", validateDates);
  dueDate.addEventListener("change", validateDates);
  validateDates();
</script>

{% endblock %}
